submission:
  title: "GridGuard AI"                # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED
    Power-grid transformers and substations fail unexpectedly, causing widespread outages,
    economic losses, and public safety risks. Grid operators lack a unified system that
    combines sensor health, weather context, and incident history to predict failures before
    they happen and prioritize which assets need immediate attention.

  solution_summary: >                  # REQUIRED
    GridGuard AI is an end-to-end power grid risk intelligence platform that uses a
    Random Forest ML model to predict equipment failure probability, a weighted Risk Engine
    to calculate Grid Impact Score and maintenance priority, and an IBM Granite-powered
    advisor to generate actionable crew dispatch recommendations — all surfaced through a
    real-time Streamlit dashboard.

  key_features:                        # REQUIRED
    - "Random Forest ML model predicting 7-day equipment failure probability from sensor, load, and age data"
    - "Grid Impact Score engine combining failure risk, weather severity, incident history, and customers affected"
    - "Automated P1–P4 priority ranking across all monitored grid assets"
    - "IBM Granite AI advisor generating natural-language maintenance plans and crew dispatch instructions"
    - "Interactive Streamlit dashboard with real-time risk charts, sensor gauges, and weather widgets"

  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit", "scikit-learn", "Plotly", "pandas"]
    ibm_technologies: ["ibm-watsonx-ai", "IBM Granite"]
    databases: []
    other: ["Random Forest Classifier", "Ollama (local LLM fallback)", "joblib"]

  what_we_are_most_proud_of: >
    The seamless end-to-end pipeline from raw sensor CSV data through ML inference, risk
    scoring, and into a polished dashboard that a real grid operator could use in under
    a minute. The TX-104 demo scenario showcases a P1 critical asset under severe weather
    with 4 previous failures — triggering the full AI recommendation and crew pre-positioning
    flow, making the value of the system immediately tangible to judges.

  known_limitations: >
    Training data is synthetically generated for demo purposes; a production deployment
    would require integration with real SCADA or IoT sensor streams. The IBM Granite
    integration currently falls back to a local Ollama endpoint and then to a rule-based
    mock if neither is available — a live watsonx.ai API call is the intended production
    path. No persistent database is used; all data is loaded from flat CSV files on each run.

